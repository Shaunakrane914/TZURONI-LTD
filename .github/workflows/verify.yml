name: Verify offline demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify demo and snapshot replay
        run: |
          python -m tzuroni demo
          python -m tzuroni replay outputs/demo/snapshot
          python - <<'PY'
          import pandas as pd

          for name in ('rankings', 'metrics', 'backtest'):
              pd.testing.assert_frame_equal(
                  pd.read_csv(f'outputs/demo/{name}.csv'),
                  pd.read_csv(f'outputs/replay/{name}.csv'),
              )
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-demo-report
          if-no-files-found: error
          path: |
            outputs/demo/report.html
            outputs/demo/*.csv
